<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diario Forza</title>
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forza">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Sala pesi: fondo grafite, titoli condensati da cartellone, un colore-disco per ogni giorno. */
:root{
  --bg:#111316; --bar:#15181c; --card:#1a1d22; --card2:#23272d; --line:#2c3138;
  --ink:#f1f2f4; --muted:#a0a8b3; --faint:#5d646e;
  --red:#ff5b4a; --blue:#4d8dff; --yellow:#ffc53d; --green:#3ccf7e; --white:#c9cfd6;
  --done-bg:#13261b; --on-green:#0c1a12;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --tab-h:62px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.screen{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 28px) max(18px,env(safe-area-inset-left,0px))}
body.no-tabs .screen{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-weight:800;text-transform:uppercase;margin:0;line-height:.92;text-wrap:balance}
.card{background:var(--card);border-radius:16px}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Oggi */
.row-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px;display:flex;flex-direction:column;gap:2px}
.stat .num{font-size:30px;line-height:1}
.stat small{font-size:12px;color:var(--muted)}
.list{padding:4px 14px;display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it b{font-weight:600;font-size:15px}
.list .it span{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.list .it .ss-tag{display:block;text-align:left;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:16px;border:0;background:var(--red);color:#fff;
  font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;width:100%}
.cta:active{transform:scale(.985)}
.resume{padding:14px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 0 0 2px var(--red)}
.resume div{flex:1;min-width:0}
.resume button{border:0;background:var(--red);color:#fff;border-radius:12px;height:44px;padding:0 16px;font-weight:700}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.wd{border:0;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wd .disc{width:42px;height:42px;border-radius:50%;border:3px solid var(--pc);display:grid;place-items:center;opacity:.55}
.wd .disc i{width:12px;height:12px;border-radius:50%;background:var(--pc);display:none}
.wd small{font-size:12px;color:var(--muted);white-space:nowrap}
.wd.sel .disc{opacity:1}
.wd.sel .disc i{display:block}
.wd.sel small{color:var(--ink);font-weight:600}
.wd.done .disc{background:var(--pc);opacity:1}
.wd.done .disc svg{display:block}
.wd .disc svg{display:none;width:18px;height:18px;stroke:var(--bg)}
.wd.done.sel .disc{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--pc)}

/* Allenamento */
.w-top{display:flex;align-items:center;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--card);border:0;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.w-top .info{flex:1;min-width:0;display:flex;flex-direction:column}
.w-top .info span:last-child{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.finish{height:40px;padding:0 14px;border-radius:12px;border:0;background:var(--green);color:var(--on-green);font-weight:700;font-size:14px;white-space:nowrap}
.finish.arm{background:var(--red);color:#fff}
.bar{height:4px;border-radius:4px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pc,var(--blue));border-radius:4px;transition:width .3s}
.exnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.exnav::-webkit-scrollbar{display:none}
.exnav button{flex:none;height:34px;min-width:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:none;font-weight:700;font-size:13px;color:var(--muted)}
.exnav button.cur{border-color:var(--ink);color:var(--ink)}
.exnav button.full{background:var(--done-bg);border-color:transparent;color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;font-weight:600}
.chips span{background:var(--card2);border-radius:6px;padding:4px 8px}
.chips .ss{background:none;border:1px solid var(--blue);color:var(--blue)}
.note{margin:0;font-size:13.5px;color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:6px}
.sg{display:grid;grid-template-columns:30px minmax(0,1fr) 74px 60px 48px;gap:8px;align-items:center;padding:6px 4px;border-radius:12px}
.sg.head{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:0}
.sg .n{text-align:center;font-weight:700;color:var(--muted)}
.sg .prev{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sg input{width:100%;height:44px;border-radius:10px;border:0;background:transparent;text-align:center;
  font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);padding:0}
.sg input::placeholder{color:var(--faint)}
.sg .tick{height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.sg .tick svg{width:20px;height:20px;stroke:var(--faint)}
.sg.cur{background:var(--card);box-shadow:inset 0 0 0 2px var(--red)}
.sg.cur input{background:var(--line)}
.sg.cur input::placeholder{color:var(--ink);opacity:.9}
.sg.cur .tick{border-color:#4a515b}
.sg.cur .tick svg{stroke:var(--muted)}
.sg.done{background:var(--done-bg)}
.sg.done .n{color:var(--green)}
.sg.done .tick{background:var(--green);border-color:var(--green)}
.sg.done .tick svg{stroke:var(--on-green)}
.sets-act{display:flex;gap:16px}
.link{border:0;background:none;color:var(--red);font-weight:700;font-size:14px;height:44px;padding:0 2px}
.link.dim{color:var(--muted)}
.manual{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.manual .opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.manual .opts button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-family:var(--display);font-size:20px;font-weight:700}
.manual .opts button:active{background:var(--red);border-color:var(--red);color:#fff}
.next{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;width:100%;text-align:left}
.next .label{flex:none}
.next b{flex:1;min-width:0;font-weight:600;font-size:15px}
.next span:last-child{font-size:13px;color:var(--muted);white-space:nowrap}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}

/* Recupero */
.rest{position:fixed;left:0;right:0;z-index:30;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
body:not(.no-tabs) .rest{bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.rest .in{max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgb(0 0 0/.45)}
.rest .r1{display:flex;align-items:center;gap:10px}
.rest .r1 div{flex:1;min-width:0;display:flex;flex-direction:column}
.rest .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#4a515b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest .clock{font-family:var(--display);font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rest.over .clock{color:#d6382a}
.rest button{height:48px;min-width:52px;border-radius:12px;border:1.5px solid #c4c9cf;background:transparent;font-weight:700;font-size:15px;color:var(--bg)}
.rest button.solid{background:var(--bg);color:var(--ink);border:0;padding:0 14px}
.rest .track{height:6px;border-radius:6px;background:#d5d9de;overflow:hidden}
.rest .track i{display:block;height:100%;background:var(--red);border-radius:6px}

/* Progressi */
.lifts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lift{padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lift .t{font-size:13px;color:var(--muted);font-weight:600}
.lift .num{font-size:38px;font-weight:800;line-height:1}
.lift .num small{font-family:var(--body);font-size:15px;color:var(--muted);font-weight:600}
.lift .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.up{color:var(--green)!important} .down{color:var(--red)!important}
.chart{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.chart .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chart .hd b{font-size:15px}
.chart .hd span{font-size:12px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end;height:170px;border-bottom:1px solid var(--line)}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars span{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--pc);min-height:3px}
.bars-x{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;font-size:12px;color:var(--muted);text-align:center}
.hist{display:flex;flex-direction:column;gap:8px}
.sess{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sess .h{display:flex;align-items:center;gap:10px}
.sess .h i{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none}
.sess .h b{flex:1;min-width:0;font-size:15px}
.sess .h time{font-size:12px;color:var(--muted);white-space:nowrap}
.sess .st{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sess .st b{color:var(--ink)}
.sess summary{font-size:13px;color:var(--red);font-weight:600;cursor:pointer;padding:4px 0}
.sess ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.sess li{display:flex;justify-content:space-between;gap:10px}
.sess li span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sess .del{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:6px 0}
.sess .del.arm{color:var(--red);font-weight:700}
.backup{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.backup p{margin:0;font-size:13px;color:var(--muted)}
.backup .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn2{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:14px;display:inline-flex;align-items:center}

.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;background:var(--card);border-radius:12px;padding:3px}
.seg button{height:38px;border:0;border-radius:9px;background:none;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px dashed var(--yellow);font-size:13.5px}
.banner span{flex:1;min-width:0}
button.lift{border:0;text-align:left;color:inherit}
.lc{width:100%;height:auto;display:block;overflow:visible}
.sel select{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-weight:600;font-size:16px;padding:0 12px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis small{font-size:11.5px;color:var(--muted)}
.kpis b{font-size:15px;font-variant-numeric:tabular-nums}
.tbl{display:flex;flex-direction:column;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl .tr{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 48px;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.tbl .tr span:last-child{text-align:right;font-weight:700}
.tbl .th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:0;font-weight:600}
.tbl .th span:last-child{font-weight:600}
.list .it.rec{border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit}
.list .it.rec:last-child{border-bottom:0}
.list .it small{font-size:11.5px}
.new{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);background:var(--green);border-radius:4px;padding:1px 5px;vertical-align:2px}
.bars.b8,.bars-x.b8{grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.bars.b8 span{font-size:10.5px}
.bodyfig{width:100%;height:auto;display:block;max-height:440px}
.bodyfig g[role=button]:focus{outline:none}
.bodyform{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.bodyform .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bodyform label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.fld{position:relative;display:block}
.fld input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-family:var(--display);font-size:26px;font-weight:700;padding:0 40px 0 14px}
.fld input::placeholder{color:var(--faint)}
.fld em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted)}
.last{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.last .h{display:flex;align-items:center;gap:10px}
.last .h i{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none}
.last .h b{flex:1;min-width:0}

.where{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);align-items:center}
.where>span{display:inline-flex;align-items:center;gap:5px}
.ico{width:14px;height:14px;flex:none}
.nameform{display:flex;gap:8px;width:100%}
.nameform input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:16px;padding:0 12px}
.vid{display:flex;gap:12px;align-items:center;padding:10px;text-decoration:none;color:inherit}
.vid .th{width:116px;aspect-ratio:16/9;border-radius:10px;background:var(--card2) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted)}
.vid b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.vid small{color:var(--muted);font-size:12.5px}
.weeks6 .it.now b,.weeks6 .it.now span{color:var(--ink)}
.weeks6 .it.now b::after{content:" · ora";color:var(--red);font-size:12px}
.qbox{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;padding:0 16px}
.chev{color:var(--faint);margin-left:6px}
.list a.it{text-decoration:none}
.chips-f{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips-f::-webkit-scrollbar{display:none}
.chips-f button{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;font-weight:600;font-size:13.5px;color:var(--muted)}
.chips-f button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hbars{display:grid;grid-template-columns:auto minmax(0,1fr) 28px;gap:8px 10px;align-items:center;font-size:13px}
.hbars span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.hbars div{height:10px;border-radius:10px;background:var(--card2);overflow:hidden}
.hbars i{display:block;height:100%;background:var(--red);border-radius:10px}
.hbars b{text-align:right;font-variant-numeric:tabular-nums}

/* Barra in basso */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(12px,env(safe-area-inset-left,0px))}
body.no-tabs .tabbar{display:none}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-width:72px;height:50px;justify-content:center;position:relative}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar svg{width:24px;height:24px}
.tabbar .live{position:absolute;top:6px;right:22px;width:8px;height:8px;border-radius:50%;background:var(--red)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);
  font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(0 0 0/.4)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main class="screen" id="v-home"></main>
<main class="screen" id="v-work" hidden></main>
<main class="screen" id="v-prog" hidden></main>
<main class="screen" id="v-info" hidden></main>

<div class="rest" id="rest" hidden>
  <div class="in">
    <div class="r1">
      <div><span class="lbl" id="r-lbl">Recupero</span><span class="clock" id="r-clock">0:00</span></div>
      <button id="r-minus" aria-label="Togli 15 secondi">−15</button>
      <button id="r-plus" aria-label="Aggiungi 15 secondi">+15</button>
      <button id="r-skip" class="solid">Salta</button>
    </div>
    <div class="track"><i id="r-track" style="width:0"></i></div>
  </div>
</div>

function prevSets(dayId, name){
  for (const same of [true, false]) for (const h of S.history) {
    if (same && h.day !== dayId) continue;

// Carico indicativo per le percentuali: % del massimale stimato dalle tue serie migliori.
function pctKg(ex){
  const m = /@(\d+(?:,\d+)?)%/.exec(ex.int); if (!m) return null;
  const pts = seriesFor(ex.n); if (!pts.length) return null;
  const best = Math.max(...pts.map(p => p.v));
  return Math.round(best * parseFloat(m[1].replace(",", ".")) / 100 / 2.5) * 2.5;

function tickElapsed(){
  const e = $("#elapsed"); if (!e || !S.active) return;
  const sec = Math.max(0, Math.floor((Date.now() - new Date(S.active.startedAt)) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  e.textContent = (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}

// ---- Progressi ----
const EX_NAMES = [...new Set(DAYS.flatMap(p => p.ex.filter(e => !e.bw && e.n !== "Parte a piacere").map(e => e.n)))];
const fdate = (d, o = {day:"numeric", month:"short"}) => new Date(d).toLocaleDateString("it-IT", o);
function sessTon(h){ return h.exercises.reduce((a, e) => a + tonnage(e.sets.map(s => [s.kg, s.reps])), 0); }
function bestOf(sets){ let b = null; for (const s of sets) { const v = e1rm(s.kg, s.reps); if (v && (!b || v > b.v)) b = { v, w: s.kg, r: s.reps }; } return b; }
const sheetBest = name => BASE[name] ? bestOf(BASE[name].map(([kg, reps]) => ({kg, reps}))) : null;
// Serie migliore per ogni allenamento, dalla scheda 2023 in poi (ordine cronologico).
function seriesFor(name){
  const pts = [], sb = sheetBest(name);
  if (sb) pts.push({ date: BASE_DATE, ...sb, sheet: true });
  [...S.history].reverse().forEach(h => {
    const e = h.exercises.find(x => canon(x.name) === name); if (!e) return;
    const b = bestOf(e.sets); if (b) pts.push({ date: h.date, ...b });
  });
  return pts;
}
// Esercizi in cui l'allenamento h ha battuto il record precedente (scheda compresa).
function prsIn(h){
  if (!h) return [];
  const older = S.history.filter(x => x.date < h.date);
  return h.exercises.filter(e => {
    const b = bestOf(e.sets); if (!b) return false;
    let prev = sheetBest(canon(e.name))?.v || 0;
    older.forEach(o => { const oe = o.exercises.find(x => canon(x.name) === canon(e.name)); const ob = oe && bestOf(oe.sets); if (ob && ob.v > prev) prev = ob.v; });
    return b.v > prev + 0.01;
  }).map(e => canon(e.name));
}
// ---- Orari e luoghi ----
const hm = d => new Date(d).toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"});
function timeRange(h){ return h.startedAt ? hm(h.startedAt) + "–" + hm(h.date) : hm(h.date); }
function meters(a, b){
  const R = 6371000, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
  const q = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(q));
}
// Il luogo con nome più vicino entro 250 m (o entro la precisione del GPS, se peggiore).
function placeFor(loc){
  if (!loc) return null;
  let best = null, bd = Infinity;
  for (const p of S.places) { const d = meters(loc, p); if (d < bd) { bd = d; best = p; } }
  return best && bd <= Math.max(250, loc.acc || 0) ? best : null;
}
const placeLabel = loc => placeFor(loc)?.name || "Luogo senza nome";

function monday(d){ const m = new Date(d); m.setHours(0,0,0,0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }

function lineChart(pts, val, color, unit, label){
  if (pts.length < 2) return `<p class="note">Il grafico compare dalla seconda rilevazione.</p>`;
  const W = 340, H = 160, L = 38, R = 14, T = 18, B = 26, vs = pts.map(val);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi - lo < 2) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * .15; lo -= pad; hi += pad;
  const x = i => L + i * (W - L - R) / (pts.length - 1), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const grid = [0, .5, 1].map(f => { const v = lo + (hi - lo) * f;
    return `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${kg(Math.round(v * 10) / 10)}</text>`; }).join("");
  const pd = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(vs[i]).toFixed(1)).join(" ");
  const last = pts.length - 1;
  const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(vs[i]).toFixed(1)}" r="${i === last ? 5 : 3}" fill="${i === last ? color : "var(--card)"}" stroke="${color}" stroke-width="2"/>`).join("");
  const lx = Math.min(x(last), W - R - 2);
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: da ${kg(Math.round(vs[0] * 10) / 10)} a ${kg(Math.round(vs[last] * 10) / 10)} ${unit}">
    ${grid}<path d="${pd} L${x(last).toFixed(1)} ${H - B} L${x(0).toFixed(1)} ${H - B} Z" fill="${color}" opacity=".12"/>
    <path d="${pd}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text x="${lx.toFixed(1)}" y="${(y(vs[last]) - 10).toFixed(1)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${kg(Math.round(vs[last] * 10) / 10)} ${unit}</text>
    <text x="${L}" y="${H - 7}" font-size="10" fill="var(--muted)">${pts[0].sheet ? "scheda" : fdate(pts[0].date)}</text>
    <text x="${W - R}" y="${H - 7}" text-anchor="end" font-size="10" fill="var(--muted)">${fdate(pts[last].date)}</text></svg>`;
}
// good: 1 = salire è un bene, -1 = scendere è un bene, 0 = neutro
const delta = (d, unit, good = 1) => `<span class="${!good || Math.abs(d) <= 0.05 ? "muted" : d * good > 0 ? "up" : "down"}">${d >= 0 ? "+" : "−"}${kg(Math.abs(Math.round(d * 10) / 10))} ${unit}</span>`;

function progVolume(){
  const now = new Date(), thisMon = monday(now), weeks = [];

function habits(){
  const hs = S.history.filter(h => h.startedAt); if (!hs.length) return "";
  const mins = hs.map(h => { const d = new Date(h.startedAt); return d.getHours() * 60 + d.getMinutes(); }).sort((a, b) => a - b);
  const med = mins[Math.floor(mins.length / 2)];
  const bands = [["Mattina", 0, 720], ["Pomeriggio", 720, 1020], ["Sera", 1020, 1440]].map(([l, a, b]) => [l, mins.filter(m => m >= a && m < b).length]);
  const top = Math.max(...bands.map(b => b[1])) || 1;
  const pc = {}; S.history.forEach(h => { const pl = placeFor(h.loc); if (pl) pc[pl.name] = (pc[pl.name] || 0) + 1; });
  const places = Object.entries(pc).sort((a, b) => b[1] - a[1]);
  return `<div class="card chart">
      <div class="hd"><b>Quando ti alleni</b><span>inizio di solito alle ${String(Math.floor(med / 60)).padStart(2, "0")}:${String(med % 60).padStart(2, "0")}</span></div>

      ${places.length ? `<div class="hd" style="margin-top:4px"><b>Dove</b><span>allenamenti per luogo</span></div><div class="hbars">${places.map(([l, n]) => `<span>${esc(l)}</span><div><i style="width:${Math.round(n / places[0][1] * 100)}%;background:var(--blue)"></i></div><b>${n}</b>`).join("")}</div>` : ""}

}

// Prima e ultima rilevazione di una misura (le misure non si prendono tutte ogni volta).

function progCorpo(){

function loadExample(){
  const now = new Date(), start = monday(now); start.setDate(start.getDate() - 7 * 6); start.setHours(18, 30, 0, 0);
  let n = 0;
  // Carichi di partenza inventati: la serie migliore 2023, o un valore tipico per il distretto.
  const KG = { Quadricipiti: 90, Femorali: 100, Dorso: 65, Petto: 60, Deltoidi: 14, Tricipiti: 25, Bicipiti: 14 };
  const startKg = e => BASE[e.n] ? Math.max(...BASE[e.n].map(s => s[0])) : e.bw ? 0 : KG[e.d] || 20;
  for (let w = 0; w < 7; w++) DAYS.forEach((d, di) => {
    const date = new Date(start); date.setDate(start.getDate() + w * 7 + [0, 1, 3, 4, 5][di]);
    if (date >= now) return;
    const wk = Math.min(w + 1, WEEKS), p = dayOf(d.id, wk), f = 1 + 0.018 * w, r = x => x < 30 ? Math.round(x * f) : Math.round(x * f / 2.5) * 2.5;
    const mins = 55 + di * 3 + (w % 3) * 2, st = new Date(date.getTime() - mins * 60000), away = di === 4 && w % 2;
    S.history.push({ id: "es" + n++, example: true, plan: PLAN_ID, week: wk, day: d.id, date: date.toISOString(), startedAt: st.toISOString(), minutes: mins,
      loc: away ? { lat: 45.012, lon: 9.031, acc: 30 } : { lat: 45.001, lon: 9.002, acc: 25 },
      exercises: p.ex.map(e => ({ name: e.n, sets: Array.from({length:e.s}, () => ({ kg: startKg(e) ? r(startKg(e)) : 0, reps: parseInt(e.r) || 12 })) })) });
  });
  for (let w = 0; w < 7; w++) { const d = new Date(start); d.setDate(start.getDate() + w * 7 - 1); d.setHours(8, 0, 0, 0);
    S.body.push({ id: "eb" + w, example: true, date: d.toISOString(), kg: +(80.4 - 0.12 * w).toFixed(1), waist: +(88 - 0.45 * w).toFixed(1), fat: +(19 - 0.3 * w).toFixed(1),
      m: w % 2 ? {} : { collo: 39, spalle: +(118 + 0.4 * w).toFixed(1), petto: +(102 + 0.3 * w).toFixed(1), braccio: +(36 + 0.15 * w).toFixed(1), avambraccio: 30, fianchi: +(100 - 0.35 * w).toFixed(1), coscia: +(58 + 0.2 * w).toFixed(1), polpaccio: 38 } }); }
  if (!S.places.some(pl => pl.id === "ep1")) S.places.push({ id: "ep1", example: true, name: "Palestra (esempio)", lat: 45.001, lon: 9.002 });
  saveHistory(); saveBody(); savePlaces(); render(); toast("Dati di esempio caricati");
}

  S.history = S.history.filter(h => !h.example); S.body = S.body.filter(b => !b.example); S.places = S.places.filter(pl => !pl.example);

// ---- Recupero ----
let audio = null, overFired = false;
function unlockAudio(){ try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch {} }
function beep(){
  try { unlockAudio();
    [0, .22, .44].forEach(t => { const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(.2, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + t + .18);
      o.connect(g); g.connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .2); });
  } catch {}
  try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch {}
}
function startRest(sec, label){
  if (!sec) return;
  S.rest = { end: Date.now() + sec * 1000, total: sec, label }; store.set("rest", S.rest);
  overFired = false; paintRest();
}
function stopRest(){ S.rest = null; store.set("rest", null); paintRest(); }
function paintRest(){
  const box = $("#rest");
  if (!S.rest) { box.hidden = true; return; }
  box.hidden = false;
  const left = Math.round((S.rest.end - Date.now()) / 1000), a = Math.abs(left);
  $("#r-lbl").textContent = left > 0 ? "Recupero" : "Si riparte!";
  $("#r-clock").textContent = (left < 0 ? "+" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0");
  $("#r-track").style.width = Math.max(0, Math.min(100, (1 - left / S.rest.total) * 100)) + "%";
  box.classList.toggle("over", left <= 0);
  if (left <= 0 && !overFired) { overFired = true; if (left > -3) beep(); }
  if (left < -90) stopRest();
}
$("#r-plus").onclick = () => { S.rest.end += 15000; S.rest.total += 15; overFired = false; store.set("rest", S.rest); paintRest(); };
$("#r-minus").onclick = () => { S.rest.end -= 15000; store.set("rest", S.rest); paintRest(); };
$("#r-skip").onclick = stopRest;
setInterval(() => { paintRest(); tickElapsed(); }, 250);

let wake = null;
async function keepAwake(){ try { if (S.active && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); paintRest(); } });

// ---- Azioni ----
function startWorkout(day, week){
  S.active = { day, week, startedAt: new Date().toISOString(), idx: 0, sets: {}, extra: {}, loc: null };
  saveActive(); keepAwake(); go("work");
  if (S.gps && navigator.geolocation) {
    try {
      navigator.geolocation.getCurrentPosition(pos => {
        if (!S.active) return;
        S.active.loc = { lat: +pos.coords.latitude.toFixed(5), lon: +pos.coords.longitude.toFixed(5), acc: Math.round(pos.coords.accuracy) };
        saveActive(); if (S.view === "work") renderWork();
      }, () => {}, { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 });
    } catch {}
  }
}
function tick(ei, si){
  const A = S.active, p = activeDay(), ex = p.ex[ei], k = ei + "-" + si;
  const s = A.sets[k] ||= {};
  if (s.done) { s.done = false; saveActive(); renderWork(); return; }
  const ph = suggest(ex, prevSets(A.day, ex.n), si);
  if (num(s.kg) == null) s.kg = ph[0] ? String(ph[0]).replace(".", ",") : "";
  if (num(s.reps) == null) s.reps = ph[1] != null ? String(ph[1]) : "";
  s.done = true;
  const left = i => setCount(i) - doneCount(i);
  if (ex.ss === "A") { if (left(ei + 1) > 0) A.idx = ei + 1; }
  else {
    startRest(ex.ss === "B" ? p.ex[ei - 1].rest : ex.rest, ex.n + " · serie " + (si + 1));
    if (ex.ss === "B" && left(ei - 1) > 0) A.idx = ei - 1;
    else if (left(ei) === 0) { const nx = p.ex.findIndex((_, i) => i > ei && left(i) > 0); if (nx >= 0) A.idx = nx; }
  }
  saveActive(); renderWork();
  if (A.idx !== ei) window.scrollTo({ top: 0, behavior: "smooth" });
}
let finishArmed = 0;
function finish(btn){
  const t = totals();
  if (Date.now() - finishArmed > 3500) { finishArmed = Date.now(); btn.classList.add("arm"); btn.textContent = t.done ? "Salvo? Tocca" : "Esco? Tocca"; setTimeout(() => { btn.classList.remove("arm"); btn.textContent = t.done ? "Termina" : "Esci"; }, 3500); return; }
  finishArmed = 0;
  const A = S.active, p = activeDay();
  if (t.done) {
    const exercises = p.ex.map((ex, ei) => ({ name: ex.n,
      sets: Array.from({length:setCount(ei)}, (_, si) => A.sets[ei + "-" + si]).filter(s => s && s.done).map(s => ({ kg: num(s.kg) ?? 0, reps: num(s.reps) ?? 0 })) }))
      .filter(e => e.sets.length);
    const now = new Date();
    S.history.unshift({ id: "s" + now.getTime(), plan: PLAN_ID, week: A.week, day: A.day, date: now.toISOString(), startedAt: A.startedAt, loc: A.loc || null, exercises,
      minutes: Math.max(1, Math.round((now - new Date(A.startedAt)) / 60000)) });
    saveHistory();
    const ton = exercises.reduce((a, e) => a + tonnage(e.sets.map(s => [s.kg, s.reps])), 0);
    const prs = prsIn(S.history[0]);
    toast(`Salvato: ${tons(ton)} t sollevate` + (prs.length ? ` · ${prs.length} ${prs.length === 1 ? "nuovo record" : "nuovi record"}!` : ""));
  }
  S.active = null; S.wpick = null; S.pick = null; saveActive(); stopRest();
  try { wake && wake.release(); } catch {}
  go("home");
}

async function exportData(){
  const data = JSON.stringify({ app: "diario-forza", version: 2, exported: new Date().toISOString(), history: S.history.filter(h => !h.example), height: S.height, body: S.body.filter(b => !b.example), places: S.places.filter(pl => !pl.example) }, null, 1);
  const name = "diario-forza-" + new Date().toISOString().slice(0, 10) + ".json";
  const file = new File([data], name, { type: "application/json" });
  const done = () => { store.set("lastBackup", new Date().toISOString()); if (S.view === "prog") renderProg(); };
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Backup Diario Forza" }); return done(); } }
  catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  done();
}
// Promemoria: backup mai fatto o più vecchio di 30 giorni, quando ci sono dati veri da salvare.
function backupDue(){
  const real = S.history.filter(h => !h.example);
  if (real.length < 3) return false;
  const last = store.get("lastBackup", null);
  return !last || Date.now() - new Date(last) > 30 * 864e5;
}
$("#import-file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.history)) throw 0;
    const ids = new Set(S.history.map(h => h.id)); let added = 0;
    for (const h of d.history) if (h && h.id && h.day && h.date && Array.isArray(h.exercises) && !ids.has(h.id)) { S.history.push(h); added++; }
    const bids = new Set(S.body.map(b => b.id));
    for (const b of d.body || []) if (b && b.id && b.date && (typeof b.kg === "number" || b.m || typeof b.waist === "number") && !bids.has(b.id)) { S.body.push(b); added++; }
    if (!S.height && typeof d.height === "number") { S.height = d.height; store.set("height", d.height); }
    const pids = new Set(S.places.map(pl => pl.id));
    for (const pl of d.places || []) if (pl && pl.id && pl.name && typeof pl.lat === "number" && !pids.has(pl.id)) S.places.push(pl);
    saveHistory(); saveBody(); savePlaces(); render(); toast(added ? `Importati ${added} allenamenti` : "Niente di nuovo da importare");
  } catch { toast("Questo file non è un backup di Diario Forza"); }
});

document.addEventListener("click", e => {
  unlockAudio();
  const mg = e.target.closest("[data-meas]");
  if (mg) { S.meas = mg.dataset.meas; return renderProg(); }
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.info) return openInfo(b.dataset.info);
  if (b.id === "search-btn") { S.infoFrom = S.view; S.info = null; go("info"); const q = $("#q"); q && q.focus(); return; }
  if (b.dataset.back) { if (S.info && S.fromSearch) { S.info = null; S.fromSearch = false; return go("info"); } return go(S.infoFrom || "home"); }
  if (b.dataset.pick) { S.pick = b.dataset.pick; return renderHome(); }
  if (b.id === "start") { if (S.active) return go("work"); return startWorkout(b.dataset.day, Number(b.dataset.week)); }
  if (b.dataset.wk) { S.wpick = Number(b.dataset.wk); S.pick = null; return renderHome(); }
  if (b.dataset.tick) { const [ei, si] = b.dataset.tick.split("-").map(Number); return tick(ei, si); }
  if (b.dataset.ex) { S.active.idx = Number(b.dataset.ex); saveActive(); renderWork(); return window.scrollTo(0, 0); }
  if (b.dataset.extra) {
    const A = S.active, ei = A.idx, dir = Number(b.dataset.extra);
    A.extra[ei] = Math.max(activeDay().ex[ei].smin - activeDay().ex[ei].s, (A.extra[ei] || 0) + dir);
    if (dir < 0) delete A.sets[ei + "-" + setCount(ei)];
    saveActive(); return renderWork();
  }
  if (b.dataset.rest) return startRest(Number(b.dataset.rest), "manuale");
  if (b.id === "finish") return finish(b);
  if (b.id === "finish2") return finish($("#finish"));
  if (b.dataset.del) {
    if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent = "Tocca di nuovo per eliminare"; setTimeout(() => { b.classList.remove("arm"); b.textContent = "Elimina"; }, 3500); return; }
    S.history = S.history.filter(h => h.id !== b.dataset.del); saveHistory(); renderProg(); return toast("Allenamento eliminato");
  }
  if (b.dataset.ptab) { S.ptab = b.dataset.ptab; store.set("ptab", S.ptab); return renderProg(); }
  if (b.dataset.pex) { S.pex = b.dataset.pex; S.ptab = "forza"; renderProg(); return window.scrollTo({ top: 0, behavior: "smooth" }); }
  if (b.dataset.pfilter) { S.pfilter = b.dataset.pfilter; return renderProg(); }
  if (b.dataset.name) { S.naming = b.dataset.name; renderProg(); const i = document.getElementById("pn-" + b.dataset.name); i && i.focus(); return; }
  if (b.dataset.pdel) { S.places = S.places.filter(pl => pl.id !== b.dataset.pdel); if (S.pfilter === b.dataset.pdel) S.pfilter = "all"; savePlaces(); return renderProg(); }
  if (b.id === "gps-toggle") { S.gps = !S.gps; store.set("gps", S.gps); return renderProg(); }
  if (b.id === "ex-load") return loadExample();
  if (b.id === "ex-clear") return clearExample();
  if (b.dataset.bdel) { S.body = S.body.filter(x => x.id !== b.dataset.bdel); saveBody(); return renderProg(); }
  if (b.id === "export") return exportData();
  if (b.id === "wipe") {
    if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent = "Sicuro? Tocca di nuovo per cancellare"; setTimeout(() => { if (b.isConnected) renderProg(); }, 4000); return; }
    S.history = []; S.body = S.body.filter(b => !b.example); S.places = S.places.filter(pl => !pl.example);
    saveHistory(); saveBody(); savePlaces(); S.wpick = null; renderProg(); return toast("Allenamenti cancellati");
  }
  if (b.id === "import") return $("#import-file").click();
});
document.addEventListener("input", e => {
  const i = e.target;
  if (i.id === "q") { S.q = i.value; $("#sres").innerHTML = searchResults(); return; }
  if (!i.dataset.k || !S.active) return;
  (S.active.sets[i.dataset.k] ||= {})[i.dataset.f] = i.value; saveActive();
});
document.addEventListener("change", e => { if (e.target.id === "pex") { S.pex = e.target.value; renderProg(); } });
document.addEventListener("submit", e => {
  const nf = e.target.closest("[data-nameloc]");
  if (nf) {
    e.preventDefault();
    const h = S.history.find(x => x.id === nf.dataset.nameloc), name = nf.querySelector("input").value.trim();
    if (!h || !h.loc) return;
    if (!name) return toast("Scrivi un nome per il luogo");
    S.places.push({ id: "p" + Date.now(), name, lat: h.loc.lat, lon: h.loc.lon }); S.naming = null;
    savePlaces(); renderProg(); return toast(`Salvato: ${name}`);
  }
  if (e.target.id !== "bodyform") return;
  e.preventDefault();
  const val = id => num($("#b-" + id).value);
  const w = val("kg"), h = val("height"), fat = val("fat");
  if (w != null && (w < 30 || w > 300)) return toast("Scrivi il peso in kg, per esempio 79,5");
  if (h != null && (h < 120 || h > 230)) return toast("Scrivi l'altezza in cm, per esempio 178");
  if (fat != null && (fat < 3 || fat > 60)) return toast("La massa grassa va in %, per esempio 18");
  const m = {}; let bad = null;
  MEAS.forEach(x => { const v = val(x.k); if (v == null) return; if (v < 15 || v > 200) bad = x.l; else m[x.k] = v; });
  if (bad) return toast(`${bad}: scrivi i centimetri, per esempio 38,5`);
  if (h != null) { S.height = h; store.set("height", h); }
  const { waist, ...rest } = m, any = w != null || fat != null || Object.keys(m).length;
  if (!any) { renderProg(); return toast(h != null ? "Altezza salvata" : "Scrivi almeno una misura"); }
  const today = new Date().toISOString().slice(0, 10), t = S.body.find(x => x.date.slice(0, 10) === today && !x.example);
  const en = t || { id: "b" + Date.now(), date: new Date().toISOString() };
  en.kg = w ?? undefined; en.waist = waist ?? undefined; en.fat = fat ?? undefined; en.m = rest;
  if (!t) S.body.push(en);
  saveBody(); renderProg(); toast("Misure salvate");
});
document.addEventListener("keydown", e => { const g = e.target.closest && e.target.closest("g[data-meas]"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); S.meas = g.dataset.meas; renderProg(); } });
document.addEventListener("focusin", e => { if (e.target.matches(".sg input")) e.target.select(); });

// Un allenamento lasciato a metà con la scheda vecchia non si può riprendere.
if (S.active && !DAYS.some(d => d.id === S.active.day)) { S.active = null; saveActive(); }
if (S.active) { S.view = "work"; keepAwake(); }
render(); paintRest();
// Chiede a iOS/Android di non cancellare i dati dell'app quando manca spazio.
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch {}
// Controlla subito se c'è una versione nuova, e di nuovo ogni volta che l'app torna in primo piano.
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
  reg.update().catch(() => {});
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
}).catch(() => {});
</script>
